<!doctype html>
<html lang="en" class="no-js">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members | CCEL</title>
<meta name="theme-color" content="#0b1233">
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className = 'js';</script>
<script src="_shared/content.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/members.js" defer></script>

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="rail" id="site-menu"></div>

<div class="shell">
<header class="page-head">
  <div class="art" aria-hidden="true"></div>
  <div class="wrap">
    <div data-topbar></div>
    <p class="crumb"><a href="index.html">Home</a> / Members</p>
    <h1>Members</h1>
    <p class="sub" data-m="sub"></p>
  </div>
</header>
<nav class="tabs" aria-label="Groups"><div class="wrap" data-m="tabs"></div></nav>
<main id="main" class="sec" style="padding-top:48px">
  <div class="wrap">
    <section id="professor" class="group" aria-labelledby="h-prof" data-m="prof"></section>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Show members by research type" data-m="seg">
        <button type="button" data-type="" aria-pressed="true">All</button>
        <button type="button" data-type="computational" aria-pressed="false">Computational</button>
        <button type="button" data-type="experimental" aria-pressed="false">Experimental</button>
      </div>
      <p class="small" data-m="seg-note" aria-live="polite"></p>
    </div>
    <div data-m="groups"></div>
    <section id="alumni" class="group alumni" aria-labelledby="h-alumni">
      <div class="group-head"><h2 id="h-alumni">Alumni</h2><span data-m="alumni-count"></span></div>
      <div data-m="alumni"></div>
    </section>
    <section id="group-photo" class="group" aria-labelledby="h-photo" data-m="photo-sec">
      <div class="group-head"><h2 id="h-photo">Group photo</h2></div>
      <figure class="figure group-photo" data-m="photo"></figure>
    </section>
  </div>
</main>
<footer class="foot" id="contact" aria-labelledby="h-contact" data-foot></footer>
</div>
<noscript><p style="padding:24px;background:#fff">This page renders its content from the lab data file and needs JavaScript.</p></noscript>
</body>
</html>
