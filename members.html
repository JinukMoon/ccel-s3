<!doctype html>
<html lang="en" class="no-js">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members | CCEL</title>
<meta name="theme-color" content="#0b1233">
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className = 'js';</script>
<script src="_shared/content.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/members.js" defer></script>
</head>
<body class="members-page">
<a class="skip" href="#main">Skip to content</a>
<div class="rail" id="site-menu"></div>

<div class="shell">
<header class="page-head">
  <div class="art" aria-hidden="true"></div>
  <div class="wrap">
    <div data-topbar></div>
    <p class="crumb"><a href="index.html">Home</a> / Members</p>
    <h1>Members</h1>
    <p class="sub" data-m="sub"></p>
  </div>
</header>
<!-- Current members first; the Alumni button swaps the list (members.html#alumni opens it directly).
     The group jump links follow the list that is shown. -->
<nav class="tabs member-tabs" aria-label="Members">
  <div class="wrap">
    <div class="view-switch" role="group" aria-label="Show">
      <a href="#current" data-view-link="current">Current members</a>
      <a href="#alumni" data-view-link="alumni">Alumni</a>
    </div>
    <div class="jumps" data-m="jumps-current"></div>
    <div class="jumps" data-m="jumps-alumni" hidden></div>
  </div>
</nav>
<main id="main" class="sec members-main">
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Show members by research type" data-m="seg">
        <button type="button" data-type="" aria-pressed="true">All</button>
        <button type="button" data-type="computational" aria-pressed="false"><span class="dot computational" aria-hidden="true"></span>Computational</button>
        <button type="button" data-type="experimental" aria-pressed="false"><span class="dot experimental" aria-hidden="true"></span>Experimental</button>
      </div>
      <p class="small" data-m="seg-note" aria-live="polite"></p>
    </div>
    <div id="current" class="view" data-m="groups"></div>
    <section id="alumni" class="view alumni" aria-labelledby="h-alumni" hidden>
      <div class="alumni-head"><h2 id="h-alumni">Alumni</h2><span data-m="alumni-count"></span></div>
      <div data-m="alumni"></div>
    </section>
  </div>
</main>
<footer class="foot" data-foot></footer>
</div>
<noscript><p style="padding:24px;background:#fff">This page renders its content from the lab data file and needs JavaScript.</p></noscript>
</body>
</html>
