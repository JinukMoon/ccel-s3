<!doctype html>
<html lang="en" class="no-js">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCEL</title>
<meta name="theme-color" content="#0b1233">
<link rel="preload" href="_shared/scroll/manifest.json" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className = 'js';</script>
<script src="_shared/content.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/home.js" defer></script>
<script src="js/stage.js" defer></script>
</head>
<body>
<a class="skip" href="#news">Skip to content</a>
<div class="rail" id="site-menu"></div>

<div class="shell">
<main id="main">
  <!-- Scroll stage: a framed window opens to full bleed while the hero sequence scrubs.
       All text here is DOM text from window.CCEL; the frames carry no information. -->
  <section class="stage" data-stage aria-labelledby="lab-name">
    <div class="stage-pin">
      <div class="stage-window" aria-hidden="true">
        <div class="stage-media">
          <img class="stage-poster" alt="" decoding="async" fetchpriority="high">
          <canvas class="stage-canvas"></canvas>
        </div>
        <div class="stage-tint"></div>
      </div>
      <div class="stage-inner">
        <div data-topbar></div>
        <div class="stage-card">
          <p class="eyebrow" data-f="affiliation"></p>
          <h1 id="lab-name" data-f="name"></h1>
          <p class="identity" data-f="tagline"></p>
        </div>
        <div class="stage-frame"><span class="stage-cue">Scroll</span></div>
      </div>
    </div>
  </section>

  <!-- Landing = the key information only, as on the current Welcome page.
       Research, people and the full publication list live on their own pages. -->
  <div class="sheet">
    <div class="sec">
      <div class="wrap two">
        <section id="news" aria-labelledby="h-news">
          <header class="sec-head"><span class="sec-num">01</span><h2 id="h-news">News</h2></header>
          <ul class="news" data-n="news"></ul>
        </section>
        <section id="opening" aria-labelledby="h-open">
          <header class="sec-head"><span class="sec-num">02</span><h2 id="h-open">Open Position</h2></header>
          <div class="join-box" data-n="opening"></div>
        </section>
      </div>
    </div>

    <section class="sec alt" id="selected" aria-labelledby="h-sel">
      <div class="wrap">
        <header class="sec-head"><span class="sec-num">03</span><h2 id="h-sel">Selected Publications</h2></header>
        <ol class="pins" data-p="pins"></ol>
        <p class="pins-more"><a class="more" href="publications.html#selected">Selected publications and recent highlights</a></p>
      </div>
    </section>

    <section class="sec" id="about" aria-labelledby="h-about">
      <div class="wrap">
        <header class="sec-head"><span class="sec-num">04</span><h2 id="h-about">About CCEL</h2></header>
        <div class="about" data-a="about"></div>
      </div>
    </section>
  </div>
</main>
<footer class="foot" id="contact" aria-labelledby="h-contact" data-foot></footer>
</div>
<noscript><p style="padding:24px;background:#fff">This page renders its content from the lab data file and needs JavaScript.</p></noscript>
</body>
</html>
